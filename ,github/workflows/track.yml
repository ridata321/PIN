name: 小機票 抓價

on:
  schedule:
    # 每 3 小時一次。cron 是 UTC，這裡對齊雅加達時間 (UTC+7)：
    # 08:00 11:00 14:00 17:00 20:00 23:00 02:00 05:00 WIB
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      slice:
        description: "要掃第幾份（1-8）。留空 = 依現在時間自動決定。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓價
        env:
          PROVIDER: google-flights
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -n "${{ inputs.slice }}" ]; then
            python src/track.py --slice $(( ${{ inputs.slice }} - 1 ))
          else
            python src/track.py
          fi

      - name: 把新資料 commit 回 repo
        run: |
          git config user.name  "xiaojipiao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/price_log.csv data/options.json docs/data.json docs/detail-*.json
          if git diff --staged --quiet; then
            echo "這一輪沒有新資料，不 commit"
          else
            git commit -m "票價更新 $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git pull --rebase --autostash
            git push
          fi
